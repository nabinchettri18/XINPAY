name: Build and security checks
on:
  push:
    branches: [main, production-readiness-phase-2-6]
  pull_request:
    branches: [main, production-readiness-phase-2-6]
concurrency:
  group: xinpay-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - run: node --test tests/*.test.mjs
      - run: npx wrangler deploy --dry-run --outdir=worker-build
