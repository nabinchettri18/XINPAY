name: Build and security checks
on:
  push:
    branches: [main, production-readiness-phase-2-6, direct-upi-manual-reconciliation]
  pull_request:
    branches: [main, production-readiness-phase-2-6]
concurrency:
  group: xinpay-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - name: Check Vercel Function syntax
        run: find api server -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: node --test tests/*.test.mjs
